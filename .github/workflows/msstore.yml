# The Microsoft Store package (MSIX); see docs/MSSTORE.md.
#
# - On a release tag (v1.2.3, not betas): builds the Store version of the
#   game and packs it. The package (the `msix` artifact of the run) is sent
#   to the Store by hand, in Partner Center, with the version's notes.
# - When the packaging changes (any branch): builds and packs only, so a
#   mistake shows up here and not on release day.
# - By hand (Actions → Microsoft Store → Run workflow).
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   MSSTORE_IDENTITY_NAME, MSSTORE_PUBLISHER, MSSTORE_PUBLISHER_DISPLAY_NAME
#     (Partner Center → Product management → Product identity),
#   MSSTORE_DISPLAY_NAME (the name reserved in the Store),
#   SNOOK_LEGEND_SERVER (the game server, as for the other releases).
name: Microsoft Store

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/client/msix/**"
      - "tools/msix/**"
      - ".github/workflows/msstore.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    # Branch pushes only build when the packaging changed.
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: check
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF" == refs/tags/* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Everything the push brought (a new branch: compared with main).
          base="$BEFORE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git merge-base HEAD origin/main 2>/dev/null || echo HEAD~1)
          fi
          if git diff --name-only "$base" HEAD \
              | grep -qE '^(crates/client/msix/|tools/msix/|\.github/workflows/msstore\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  msix:
    name: Build the MSIX
    needs: changes
    # Tags: final versions only (v0.1.1, not v0.1.1-beta.1).
    if: >-
      needs.changes.outputs.run == 'true' &&
      !(startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-'))
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: msstore
      - name: Build the Store version of the game
        shell: pwsh
        env:
          SNOOK_LEGEND_SERVER: ${{ vars.SNOOK_LEGEND_SERVER }}
          # The C runtime inside the executable: nothing else to install.
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p snook-legend --features store
      - name: Pack the MSIX
        id: pack
        shell: pwsh
        env:
          # Repository *variables*, not secrets: the identity is public (it is
          # in every package's manifest).
          IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
          DISPLAY_NAME: ${{ vars.MSSTORE_DISPLAY_NAME }}
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          # A release must carry Partner Center's identity (the Store refuses
          # any other): fail here, saying what is missing, rather than pack a
          # package the Store would turn away. Elsewhere a placeholder
          # identity is enough to check the packaging.
          $missing = @('IDENTITY_NAME', 'PUBLISHER', 'PUBLISHER_DISPLAY_NAME', 'DISPLAY_NAME') |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) } |
            ForEach-Object { "MSSTORE_$_" }
          if ($env:RELEASE -eq 'true' -and $missing) {
            throw "Set these repository variables (Settings -> Secrets and variables -> Actions -> Variables, not Secrets): $($missing -join ', ')"
          }
          $id = if ($env:IDENTITY_NAME) { $env:IDENTITY_NAME } else { "SnookLegend.Development" }
          $pub = if ($env:PUBLISHER) { $env:PUBLISHER } else { "CN=Snook Legend Development" }
          $pubName = if ($env:PUBLISHER_DISPLAY_NAME) { $env:PUBLISHER_DISPLAY_NAME } else { "Snook Legend" }
          $name = if ($env:DISPLAY_NAME) { $env:DISPLAY_NAME } else { "Snook Legend" }
          ./tools/msix/make-msix.ps1 -IdentityName $id -Publisher $pub -PublisherDisplayName $pubName -DisplayName $name
      - uses: actions/upload-artifact@v7
        with:
          name: msix
          path: target/msix/*.msix
