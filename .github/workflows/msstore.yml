# The Microsoft Store package (MSIX); see docs/MSSTORE.md.
#
# - On a release tag (v1.2.3, not betas): builds the Store version of the
#   game, packs it and, once the repository variable MSSTORE_APP_ID is set,
#   sends it to the Store (tools/msstore_submit.py): a new submission with
#   this package and "What's new" in every language of the Store listing,
#   from crates/client/whatsnew. Without MSSTORE_APP_ID the package (the
#   `msix` artifact of the run) is sent by hand, in Partner Center.
# - When the packaging changes (any branch): builds and packs only, so a
#   mistake shows up here and not on release day.
# - By hand (Actions → Microsoft Store → Run workflow): builds and packs;
#   run on a tag with "Send to the Store" ticked, it sends it too. With
#   "Only check the connection" ticked (any branch), it only signs in to
#   Partner Center and reads the game: nothing is built or sent. With
#   "Update the Store page" ticked, it sends the Store page alone (texts
#   from store-listing/, screenshots and logos from store-art/, every
#   language), keeping the package in the Store.
#
# Secrets for sending (Settings → Secrets and variables → Actions → Secrets,
# or the `microsoft-store` environment's): MSSTORE_TENANT_ID,
# MSSTORE_CLIENT_ID, MSSTORE_CLIENT_SECRET, a Microsoft Entra application
# with the Manager role in Partner Center.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   MSSTORE_IDENTITY_NAME, MSSTORE_PUBLISHER, MSSTORE_PUBLISHER_DISPLAY_NAME
#     (Partner Center → Product management → Product identity),
#   MSSTORE_DISPLAY_NAME (the name reserved in the Store),
#   SNOOK_LEGEND_SERVER (the game server, as for the other releases),
#   MSSTORE_PURCHASES: "on" sells coin packs and months of VIP as Store
#     add-ons in the package; anything else (or unset) builds it without
#     any purchase for real money (coins are earned by playing), so the
#     Store's age rating needs no "in-game purchases".
#   MSSTORE_APP_ID: the game's Store ID (9NZ…, Partner Center → Product
#     identity); set, release tags are sent to the Store by themselves.
name: Microsoft Store

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/client/msix/**"
      - "crates/client/whatsnew/**"
      - "store-listing/**"
      - "tools/msix/**"
      - "tools/msstore_submit.py"
      - ".github/workflows/msstore.yml"
  workflow_dispatch:
    inputs:
      check:
        description: Only check the connection with Partner Center (builds and sends nothing)
        type: boolean
        default: false
      listing:
        description: Update the Store page (texts, screenshots and logos of every language) from the repository, keeping the package
        type: boolean
        default: false
      submit:
        description: Send to the Store (run it on a version's tag)
        type: boolean
        default: false
      replace_pending:
        description: Replace a submission in progress in Partner Center
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    # Branch pushes only build when the packaging changed, and check the
    # Store's texts when they changed.
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check.outputs.run }}
      texts: ${{ steps.check.outputs.texts }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: check
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF" == refs/tags/* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "texts=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Everything the push brought (a new branch: compared with main).
          base="$BEFORE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git merge-base HEAD origin/main 2>/dev/null || echo HEAD~1)
          fi
          changed=$(git diff --name-only "$base" HEAD)
          if grep -qE '^(crates/client/msix/|tools/msix/|tools/msstore_submit\.py|\.github/workflows/msstore\.yml)' <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(crates/client/whatsnew/|store-listing/|tools/msstore_submit\.py)' <<< "$changed"; then
            echo "texts=true" >> "$GITHUB_OUTPUT"
          else
            echo "texts=false" >> "$GITHUB_OUTPUT"
          fi

  msix:
    name: Build the MSIX
    needs: changes
    # Tags: final versions only (v0.1.1, not v0.1.1-beta.1).
    if: >-
      needs.changes.outputs.run == 'true' && !inputs.check && !inputs.listing &&
      !(startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-'))
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: msstore
      - name: Build the Store version of the game
        shell: pwsh
        env:
          SNOOK_LEGEND_SERVER: ${{ vars.SNOOK_LEGEND_SERVER }}
          # The C runtime inside the executable: nothing else to install.
          RUSTFLAGS: -C target-feature=+crt-static
          PURCHASES: ${{ vars.MSSTORE_PURCHASES }}
        run: |
          # Sales in the Store only when the repository variable says so.
          $features = if ($env:PURCHASES -eq 'on') { 'store-purchases' } else { 'store' }
          Write-Host "Store build with: $features"
          cargo build --release --locked -p snook-legend --features $features
      - name: Pack the MSIX
        id: pack
        shell: pwsh
        env:
          # Repository *variables*, not secrets: the identity is public (it is
          # in every package's manifest).
          IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
          DISPLAY_NAME: ${{ vars.MSSTORE_DISPLAY_NAME }}
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          # A release must carry Partner Center's identity (the Store refuses
          # any other): fail here, saying what is missing, rather than pack a
          # package the Store would turn away. Elsewhere a placeholder
          # identity is enough to check the packaging.
          $missing = @('IDENTITY_NAME', 'PUBLISHER', 'PUBLISHER_DISPLAY_NAME', 'DISPLAY_NAME') |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) } |
            ForEach-Object { "MSSTORE_$_" }
          if ($env:RELEASE -eq 'true' -and $missing) {
            throw "Set these repository variables (Settings -> Secrets and variables -> Actions -> Variables, not Secrets): $($missing -join ', ')"
          }
          $id = if ($env:IDENTITY_NAME) { $env:IDENTITY_NAME } else { "SnookLegend.Development" }
          $pub = if ($env:PUBLISHER) { $env:PUBLISHER } else { "CN=Snook Legend Development" }
          $pubName = if ($env:PUBLISHER_DISPLAY_NAME) { $env:PUBLISHER_DISPLAY_NAME } else { "Snook Legend" }
          $name = if ($env:DISPLAY_NAME) { $env:DISPLAY_NAME } else { "Snook Legend" }
          ./tools/msix/make-msix.ps1 -IdentityName $id -Publisher $pub -PublisherDisplayName $pubName -DisplayName $name
      - uses: actions/upload-artifact@v7
        with:
          name: msix
          path: target/msix/*.msix

  notes:
    # Every language's listing checked against Partner Center's limits and
    # "What's new in this version" as it would be sent, so a mistake shows
    # up before release day.
    name: The Store's texts
    needs: changes
    if: >-
      (needs.changes.outputs.run == 'true' || needs.changes.outputs.texts == 'true') &&
      !inputs.check && !inputs.listing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: The listings (store-listing/)
        run: python3 -B tools/msstore_submit.py listings
      - name: The notes of the newest version
        run: |
          version=$(sed -n 's/^## //p' crates/client/whatsnew/en.md | head -n1)
          python3 -B tools/msstore_submit.py notes "$version"

  check:
    # By hand: the secrets, the application's role in Partner Center and
    # MSSTORE_APP_ID, checked without changing anything.
    name: Check the connection with Partner Center
    if: github.event_name == 'workflow_dispatch' && inputs.check
    runs-on: ubuntu-24.04
    environment: microsoft-store
    steps:
      - uses: actions/checkout@v5
      - name: Sign in and read the game
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          APP_ID: ${{ vars.MSSTORE_APP_ID }}
        run: |
          if [[ -z "$APP_ID" ]]; then
            echo "Set the repository variable MSSTORE_APP_ID (the Store ID, 9NZ…)"; exit 1
          fi
          python3 -B tools/msstore_submit.py check --app-id "$APP_ID"

  listing:
    # By hand: the Store page from the repository, without a new package.
    name: Update the Store page
    if: github.event_name == 'workflow_dispatch' && inputs.listing && !inputs.check
    runs-on: ubuntu-24.04
    environment: microsoft-store
    concurrency:
      group: msstore-submission
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: New submission with every language's texts, screenshots and logos
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          APP_ID: ${{ vars.MSSTORE_APP_ID }}
          REPLACE: ${{ inputs.replace_pending }}
        run: |
          if [[ -z "$APP_ID" ]]; then
            echo "Set the repository variable MSSTORE_APP_ID (the Store ID, 9NZ…)"; exit 1
          fi
          args=(listing --app-id "$APP_ID")
          if [[ "$REPLACE" == "true" ]]; then args+=(--replace-pending); fi
          python3 -B tools/msstore_submit.py "${args[@]}"

  submit:
    name: Send to the Store
    needs: msix
    # Final release tags once MSSTORE_APP_ID is set; by hand, on a tag, with
    # "Send to the Store" ticked.
    if: >-
      vars.MSSTORE_APP_ID != '' &&
      startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') &&
      (github.event_name == 'push' || inputs.submit)
    runs-on: ubuntu-24.04
    # Its secrets can live here, and required reviewers set on it make the
    # submission wait for a click (Settings → Environments).
    environment: microsoft-store
    # One submission at a time: Partner Center takes only one in progress.
    concurrency:
      group: msstore-submission
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: msix
          path: msix
      - name: New submission with this package and the version's notes
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          APP_ID: ${{ vars.MSSTORE_APP_ID }}
          TAG: ${{ github.ref_name }}
          REPLACE: ${{ inputs.replace_pending }}
        run: |
          shopt -s nullglob
          packages=(msix/*.msix)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected one .msix in the artifact, found ${#packages[@]}"; exit 1
          fi
          args=(submit --app-id "$APP_ID" --version "${TAG#v}" --package "${packages[0]}")
          if [[ "$REPLACE" == "true" ]]; then args+=(--replace-pending); fi
          python3 -B tools/msstore_submit.py "${args[@]}"
