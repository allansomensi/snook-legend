# Push a tag like `v0.2.0` to publish the server image on GitHub Container
# Registry (the game itself is built and released by release.yml, which dist
# generates).
name: Server image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  server:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Pre-releases (v0.2.0-beta.1) don't move `latest`.
          tags: |
            ghcr.io/${{ github.repository_owner }}/snook-legend-server:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && format('ghcr.io/{0}/snook-legend-server:latest', github.repository_owner) || '' }}
      # Puts the new image live on Render (its "Deploy Hook", saved as the
      # repository secret RENDER_DEPLOY_HOOK): until the server runs the new
      # version, the new game can't play online. Not for pre-releases.
      - name: Deploy on Render
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::No RENDER_DEPLOY_HOOK secret: deploy the new image on Render by hand (Manual Deploy → Deploy latest reference)."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Render is deploying the new image."
