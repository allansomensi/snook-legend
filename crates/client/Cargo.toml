[package]
name = "snookered"
description = "Snookered: a lightweight 3D eight-ball pool game with an online lounge"
authors = ["Allan Somensi"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/allansomensi/snookered"
readme = "../../README.md"

[package.metadata.wix]
upgrade-guid = "38A3FD0E-86A2-4518-A4AF-067047C4D793"
path-guid = "09226FE3-7CEA-4013-B441-D824AE8816C5"
license = false
eula = false

[features]
# The Microsoft Store build (see docs/MSSTORE.md): coin packs are bought
# through the Store itself (Store policy for games), never through the
# game's own payment pages; the Store's purchase API comes with it (Windows).
store = ["dep:windows", "dep:windows-collections"]

[build-dependencies]
# The executable's icon and version details on Windows (see build.rs).
embed-resource = "3"

[dependencies]
snookered_core = { path = "../core" }
# Same glam version as snookered_core (macroquad bundles an older one).
glam.workspace = true
macroquad = { version = "0.4.16", default-features = false, features = ["audio"] }
snookered_proto = { path = "../proto" }
# Hosting LAN games (in memory, no database).
snookered_server = { path = "../server", default-features = false }
# Online play: an event-driven WebSocket client on a background thread
# (ws:// and wss://): it wakes the moment a message comes in or goes out.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sys-locale = "0.3"
# The balls' numbers, rasterised from the bundled font (macroquad uses it too).
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Automatic updates (src/update.rs): the release on GitHub over HTTPS (rustls
# with ring and the bundled roots, like the WebSocket client; proxies from
# the environment), checked against its published SHA-256.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"

# The new version's executable, out of the release archive: .tar.xz on
# macOS and Linux, .zip on Windows (pure Rust, only what each needs).
[target.'cfg(not(windows))'.dependencies]
tar = { version = "0.4", default-features = false }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }

[target.'cfg(windows)'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
# The Store build only: Windows.Services.Store (prices, the purchase dialog
# and the key the server checks purchases with; see src/msstore.rs).
windows = { version = "0.62", optional = true, features = [
    "Services_Store",
    "Foundation",
    "Foundation_Collections",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
] }
windows-collections = { version = "0.3", optional = true }

[dev-dependencies]
# Exporting the emblem as PNG and .ico files (see src/icon.rs).
png = "0.17"

[target.'cfg(not(windows))'.dev-dependencies]
# Fake releases for the updater's tests.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder"] }
