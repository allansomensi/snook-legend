# Render Blueprint for the Snook Legend server (Starter plan: always on, no
# sleeping between players). See docs/DEPLOY.pt-BR.md.
services:
  - type: web
    name: snook-server
    runtime: docker
    plan: starter
    # Closest Render region to South America.
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    # A deploy no longer cuts games short: on SIGTERM the server stops
    # starting games, tells the lounge, and lets the games in progress go on
    # (SNOOK_LEGEND_DRAIN_SECS); what is left is saved and continues on the new server.
    maxShutdownDelaySeconds: 300
    envVars:
      # Neon connection string (the direct one, not "-pooler"). Set it in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Coin packs sold in the Microsoft Store (docs/MSSTORE.md, "Venda de
      # moedas pela Store"). Set them in the dashboard; without them the
      # Store version only earns coins by playing.
      - key: SNOOK_LEGEND_MSSTORE_TENANT_ID
        sync: false
      - key: SNOOK_LEGEND_MSSTORE_CLIENT_ID
        sync: false
      - key: SNOOK_LEGEND_MSSTORE_CLIENT_SECRET
        sync: false
      - key: SNOOK_LEGEND_MSSTORE_PRODUCTS
        sync: false
      # Who provides the game, on the terms of use (/termos, /terms, /terminos)
      # and the privacy policy (/privacidade, /privacy, /privacidad). Brazilian
      # law on online sales (Decreto 7.962/2013) asks a seller to show their
      # name, CPF or CNPJ, address and an e-mail: set them in the dashboard.
      - key: SNOOK_LEGEND_PRIVACY_CONTROLLER
        sync: false
      - key: SNOOK_LEGEND_LEGAL_DOCUMENT
        sync: false
      - key: SNOOK_LEGEND_LEGAL_ADDRESS
        sync: false
      # The e-mail for customer service, refunds, appeals and privacy requests.
      - key: SNOOK_LEGEND_PRIVACY_CONTACT
        sync: false
      # Your username: you become an administrator the next time you sign in.
      - key: SNOOK_LEGEND_ADMINS
        sync: false
      # Render sits behind Cloudflare: take the player's real address from these.
      - key: SNOOK_LEGEND_CLIENT_IP_HEADER
        value: cf-connecting-ip,true-client-ip,x-forwarded-for
      - key: SNOOK_LEGEND_DB_POOL
        value: "5"
      - key: SNOOK_LEGEND_SHOT_CLOCK
        value: "30"
      - key: SNOOK_LEGEND_DRAIN_SECS
        value: "270"
      # The weekly cup (an arena organised by the server).
      - key: SNOOK_LEGEND_CUP
        value: "sat 20:00 60m"
      - key: RUST_LOG
        value: info
