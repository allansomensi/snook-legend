# Render Blueprint for the Snook Legend server (Starter plan: always on, no
# sleeping between players). See docs/DEPLOY.pt-BR.md.
services:
  - type: web
    # The service's name on Render (its address, snook-server.onrender.com,
    # was given when it was made and stays).
    name: snook-legend-server
    runtime: docker
    plan: starter
    # Closest Render region to South America.
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    # A deploy no longer cuts games short: on SIGTERM the server stops
    # starting games, tells the lounge, and lets the games in progress go on
    # (SNOOK_LEGEND_DRAIN_SECS); what is left is saved and continues on the new server.
    maxShutdownDelaySeconds: 300
    envVars:
      # Neon connection string (the direct one, not "-pooler"). Set it in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Coin packs and the month of VIP sold in the Microsoft Store
      # (docs/MSSTORE.md, "Venda de moedas e VIP pela Store"). Set them in the
      # dashboard; without them the Store version only earns coins by playing.
      - key: SNOOK_LEGEND_MSSTORE_TENANT_ID
        sync: false
      - key: SNOOK_LEGEND_MSSTORE_CLIENT_ID
        sync: false
      - key: SNOOK_LEGEND_MSSTORE_CLIENT_SECRET
        sync: false
      - key: SNOOK_LEGEND_MSSTORE_PRODUCTS
        sync: false
      # The staff portal's origin (its own site, on Vercel): the only one a
      # browser may call the staff API from, https://admin.snooklegend.app
      # (docs/DEPLOY.pt-BR.md, 11.4).
      - key: SNOOK_LEGEND_ADMIN_ORIGIN
        sync: false
      # The server's public address (the payment return pages):
      # https://api.snooklegend.app once that domain is set up (11.3).
      - key: SNOOK_LEGEND_PUBLIC_URL
        sync: false
      # (The terms of use and the privacy policy are on the website,
      # snooklegend.app: who provides the game is set in Vercel, LEGAL_*.)
      # Your username: you become an administrator the next time you sign in.
      - key: SNOOK_LEGEND_ADMINS
        sync: false
      # Render sits behind Cloudflare: take the player's real address from these.
      - key: SNOOK_LEGEND_CLIENT_IP_HEADER
        value: cf-connecting-ip,true-client-ip,x-forwarded-for
      - key: SNOOK_LEGEND_DB_POOL
        value: "5"
      - key: SNOOK_LEGEND_SHOT_CLOCK
        value: "30"
      - key: SNOOK_LEGEND_DRAIN_SECS
        value: "270"
      # The weekly cup (an arena organised by the server).
      - key: SNOOK_LEGEND_CUP
        value: "sat 20:00 60m"
      - key: RUST_LOG
        value: info
